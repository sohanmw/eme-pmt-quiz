<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quiz Live — Interactive Real-Time Audience Engine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap narrow" style="justify-content:center; min-height:100vh;">
    <div class="brand" style="margin: 0 auto 32px; justify-content:center;">
      <div class="brand-left">
        <span class="mark"></span>
        <h1 style="font-size:22px;">Quiz Live</h1>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px; padding:32px 28px;">
      <h2 style="margin-top:0; font-size:22px; font-weight:700; letter-spacing:-0.02em;">Join Live Session</h2>
      <p class="muted" style="margin-top:-6px; margin-bottom:20px;">Enter your 6-digit session PIN to connect instantly.</p>
      <form id="joinForm">
        <input type="text" id="pinInput" placeholder="000000" inputmode="numeric" maxlength="6"
               style="font-size:26px; font-weight:700; letter-spacing:0.14em; text-align:center; width:100%; margin-bottom:16px;">
        <button class="btn block" type="submit" style="padding:14px; font-size:15px;">Connect to Session</button>
      </form>
    </div>

    <div class="card" style="padding:24px 28px;">
      <div class="row between" style="flex-wrap:wrap; gap:16px;">
        <div>
          <h3 style="margin:0; font-size:16px; font-weight:700;">Host a Session</h3>
          <p class="muted" style="margin:4px 0 0; font-size:13px;">Create, present, and run real-time polls & trivia.</p>
        </div>
        <a class="btn secondary" href="host.html" style="padding:10px 18px; font-size:13px;">Open Host Dashboard →</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('joinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      if (pin) window.location.href = `player.html?pin=${encodeURIComponent(pin)}`;
    });
  </script>
</body>
</html>
